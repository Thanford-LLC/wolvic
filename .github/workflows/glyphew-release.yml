name: Glyphew Release

# Triggers:
#   - Push a tag like v1.0.0 → full signed release APK + GitHub Release
#   - Manual dispatch → signed APK artifact (no release created)
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: false

env:
  # GeckoView version to use (must match app/build.gradle geckoview_version)
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"

jobs:
  # ── Build ────────────────────────────────────────────────
  build:
    name: Build Quest APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Android SDK + NDK ─────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            --sdk_root="$ANDROID_SDK_ROOT"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT"           >> local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # ── Keystore ──────────────────────────────────────────
      # Provide RELEASE_KEYSTORE_B64 (base64-encoded .jks) as a GitHub Secret.
      # Falls back to debug signing when the secret is absent (e.g. forks/PRs).
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/release.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore — will use debug signing"
          fi

      # ── APK build ─────────────────────────────────────────
      # Release APK uses Gecko: GeckoView is fetched from Maven (no private AAR needed),
      # making the release build fully reproducible in CI. Chromium is the default
      # for local dev/test (CLAUDE.md §4.4) but the shipped APK targets Gecko for
      # release stability. JVM tests cover both backends via the unit-tests-chromium job.
      # MetaStore flavour requires OVR Platform SDK; Generic works without it.
      - name: Build release APK (signed)
        if: steps.keystore.outputs.available == 'true'
        env:
          SIGNING_STORE_FILE:     ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS:      ${{ secrets.RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD:   ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleOculusvrArm64GeckoGenericRelease \
            -PsigningStoreFile="$SIGNING_STORE_FILE"             \
            -PsigningStorePassword="$SIGNING_STORE_PASSWORD"     \
            -PsigningKeyAlias="$SIGNING_KEY_ALIAS"               \
            -PsigningKeyPassword="$SIGNING_KEY_PASSWORD"         \
            --no-daemon

      - name: Build release APK (debug-signed fallback)
        if: steps.keystore.outputs.available == 'false'
        run: |
          # user.properties is loaded by settings.gradle and sets gradle.ext properties.
          echo "useDebugSigningOnRelease=true" > user.properties
          ./gradlew assembleOculusvrArm64GeckoGenericRelease \
            --no-daemon

      # ── Upload ────────────────────────────────────────────
      - name: Find APK path
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $APK)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: glyphew-quest-release
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # ── GitHub Release (tag pushes only) ──────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.keystore.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Glyphew ${{ github.ref_name }}
          body: |
            ## Glyphew ${{ github.ref_name }}

            Quest APK built from tag `${{ github.ref_name }}`.

            ### Install
            ```
            adb install ${{ steps.apk.outputs.name }}
            ```

            ### Required: Meta developer mode
            Enable Developer Mode on your Quest before sideloading:
            Meta Horizon → Devices → Developer Mode → On
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # v1.0.0-rc1 = pre-release

  # ── Native unit tests (host build, runs on every push) ───
  native-tests:
    name: C++ Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        run: sudo apt-get install -y cmake

      - name: Configure
        working-directory: app/src/glyphew/tests
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build & Run
        working-directory: app/src/glyphew/tests
        run: cmake --build build && ./build/glyphew_tests --gtest_color=yes

  # ── JVM unit tests — Gecko and Chromium flavor ───────────
  # Robolectric tests run on JVM; no native AAR needed for Chromium flavor.
  # A fake empty directory satisfies isChromiumAvailable() without the AAR.
  jvm-tests:
    name: JVM Unit Tests (${{ matrix.backend }} flavor)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: gecko
            task: testOculusvrArm64GeckoGenericDebugUnitTest
            extra_props: ""
          - backend: chromium
            task: testOculusvrArm64ChromiumGenericDebugUnitTest
            extra_props: "-Pchromium_aar_ci=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install SDK components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            --sdk_root="$ANDROID_SDK_ROOT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create fake Chromium AAR directory (Chromium flavor only)
        if: matrix.backend == 'chromium'
        run: mkdir -p /tmp/fake-chromium-aar

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> local.properties
          if [ "${{ matrix.backend }}" = "chromium" ]; then
            echo "chromium_aar=/tmp/fake-chromium-aar" >> local.properties
          fi

      - name: Run ${{ matrix.backend }} JVM unit tests
        run: |
          ./gradlew ${{ matrix.task }} \
            -PskipDesignCheck=true \
            --no-daemon
