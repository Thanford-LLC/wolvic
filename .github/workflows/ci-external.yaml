name: CI External

on:
  workflow_dispatch:  # Allow manual triggers
  pull_request:

jobs:
  build-external:
    name: External Build
    uses: ./.github/workflows/build.yml
    with:
      flavour: ${{ matrix.flavour }}
    strategy:
      fail-fast: false
      matrix:
        flavour: [
          assembleNoapiArm64GeckoGeneric,
          assembleNoapiX64GeckoGeneric,
        ]
    secrets: inherit

  unit-tests:
    name: Unit Tests (Gecko)
    needs: [build-external]
    uses: ./.github/workflows/build.yml
    with:
      flavour: ${{ matrix.flavour }}
    strategy:
      matrix:
        flavour: [
          testNoapiArm64GeckoGenericDebugUnitTest,
          testNoapiX64GeckoGenericReleaseUnitTest,
        ]

  # Chromium-flavor JVM tests run without the native AAR (Robolectric doesn't need it).
  # A fake empty directory satisfies isChromiumAvailable() so the variants aren't filtered,
  # letting us catch backend-specific Java divergence that Gecko tests miss.
  unit-tests-chromium:
    name: Unit Tests (Chromium flavor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create fake Chromium AAR directory
        run: mkdir -p /tmp/fake-chromium-aar

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT"  >> local.properties
          echo "chromium_aar=/tmp/fake-chromium-aar" >> local.properties

      - name: Run Chromium JVM unit tests
        run: |
          ./gradlew testOculusvrArm64ChromiumGenericDebugUnitTest \
            -PskipDesignCheck=true \
            --no-daemon
