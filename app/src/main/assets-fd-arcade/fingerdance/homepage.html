<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FingerDance</title>
  <link rel="stylesheet" href="_design-vars.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
    }

    /* ── Header ─────────────────────────────────────────── */
    header { text-align: center; }

    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px 18px;
      width: 500px;
      gap: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
      overflow: hidden;
    }

    /* Arcade signature: subtle 4% opacity scanline overlay on surfaces — CRT memory */
    .search-wrap::after,
    .cell::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.04) 0,
        rgba(255, 255, 255, 0.04) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      border-radius: inherit;
    }

    .search-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }

    .search-wrap svg { flex-shrink: 0; opacity: 0.5; }

    #search {
      flex: 1;
      background: none;
      border: none;
      color: var(--text);
      font-size: 20px;
      outline: none;
      position: relative;
      z-index: 1;
    }

    #search::placeholder { color: var(--text-muted); }

    /* ── Shortcut grid ──────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 156px);
      grid-template-rows: repeat(3, 136px);
      gap: 14px;
    }

    .cell {
      position: relative;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.15s, box-shadow 0.15s;
      outline: none;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .cell .icon {
      font-size: 34px;
      line-height: 1;
      position: relative;
      z-index: 1;
    }

    .cell .label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.15s;
      position: relative;
      z-index: 1;
    }

    .cell.focused,
    .cell:hover {
      border-color: var(--accent);
      background: var(--surface-hi);
      transform: scale(1.05);
      box-shadow: 0 0 24px var(--accent-glow);
    }

    .cell.focused .label,
    .cell:hover .label {
      color: var(--text);
    }

    /* ── Footer hint ────────────────────────────────────── */
    footer {
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      line-height: 1.8;
    }

    footer kbd {
      display: inline-block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 7px;
      font-size: 12px;
      color: var(--accent);
      font-family: inherit;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">FingerDance</div>
    <div class="search-wrap">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <circle cx="8.5" cy="8.5" r="5.5" stroke="var(--accent)" stroke-width="2"/>
        <path d="M13 13l4 4" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="search" type="text" placeholder="Search or enter address" autocomplete="off" spellcheck="false">
    </div>
  </header>

  <div class="grid" id="grid" role="list" aria-label="Shortcuts">
    <div class="cell" tabindex="0" role="listitem" data-url="https://www.google.com" aria-label="Google">
      <div class="icon">🌐</div>
      <div class="label">Google</div>
    </div>
    <div class="cell focused" tabindex="0" role="listitem" data-action="focus-search" aria-label="Search">
      <div class="icon">🔍</div>
      <div class="label">Search</div>
    </div>
    <div class="cell" tabindex="0" role="listitem" data-url="about:bookmarks" aria-label="Bookmarks">
      <div class="icon">⭐</div>
      <div class="label">Bookmarks</div>
    </div>
    <div class="cell" tabindex="0" role="listitem" data-url="https://www.youtube.com" aria-label="YouTube">
      <div class="icon">▶️</div>
      <div class="label">YouTube</div>
    </div>
    <div class="cell" tabindex="0" role="listitem" data-action="new-tab" aria-label="New Tab">
      <div class="icon" style="font-size:40px;font-weight:300;color:var(--accent)">+</div>
      <div class="label">New Tab</div>
    </div>
    <div class="cell" tabindex="0" role="listitem" data-url="about:history" aria-label="History">
      <div class="icon">🕐</div>
      <div class="label">History</div>
    </div>
    <div class="cell" tabindex="0" role="listitem" data-url="https://www.reddit.com" aria-label="Reddit">
      <div class="icon">📰</div>
      <div class="label">Reddit</div>
    </div>
    <div class="cell" tabindex="0" role="listitem" data-url="about:settings" aria-label="Settings">
      <div class="icon">⚙️</div>
      <div class="label">Settings</div>
    </div>
    <div class="cell" tabindex="0" role="listitem" data-url="https://github.com" aria-label="GitHub">
      <div class="icon">🐙</div>
      <div class="label">GitHub</div>
    </div>
  </div>

  <footer>
    <kbd>Joystick</kbd> to navigate grid &nbsp;·&nbsp;
    <kbd>Grip + pattern</kbd> for browser combos &nbsp;·&nbsp;
    <kbd>Click</kbd> to open
  </footer>

  <script>
    'use strict';

    const COLS = 3;
    const grid = document.getElementById('grid');
    const cells = Array.from(grid.querySelectorAll('.cell'));
    let focused = cells.findIndex(c => c.classList.contains('focused'));
    if (focused < 0) focused = 1;

    function setFocus(idx) {
      const next = Math.max(0, Math.min(cells.length - 1, idx));
      if (next === focused) return;
      cells[focused].classList.remove('focused');
      focused = next;
      cells[focused].classList.add('focused');
    }

    const SCROLL_THRESHOLD = 36;
    let accumX = 0, accumY = 0;

    window.addEventListener('wheel', e => {
      e.preventDefault();

      accumX += e.deltaX;
      accumY += e.deltaY;

      const row = Math.floor(focused / COLS);
      const col = focused % COLS;

      if (accumY >= SCROLL_THRESHOLD) {
        accumY = 0;
        setFocus((Math.min(2, row + 1)) * COLS + col);
      } else if (accumY <= -SCROLL_THRESHOLD) {
        accumY = 0;
        setFocus((Math.max(0, row - 1)) * COLS + col);
      }

      if (accumX >= SCROLL_THRESHOLD) {
        accumX = 0;
        setFocus(row * COLS + Math.min(2, col + 1));
      } else if (accumX <= -SCROLL_THRESHOLD) {
        accumX = 0;
        setFocus(row * COLS + Math.max(0, col - 1));
      }
    }, { passive: false });

    window.addEventListener('keydown', e => {
      if (document.activeElement === document.getElementById('search')) return;

      const row = Math.floor(focused / COLS);
      const col = focused % COLS;

      switch (e.key) {
        case 'ArrowUp':
          e.preventDefault();
          setFocus(Math.max(0, row - 1) * COLS + col);
          break;
        case 'ArrowDown':
          e.preventDefault();
          setFocus(Math.min(2, row + 1) * COLS + col);
          break;
        case 'ArrowLeft':
          e.preventDefault();
          setFocus(row * COLS + Math.max(0, col - 1));
          break;
        case 'ArrowRight':
          e.preventDefault();
          setFocus(row * COLS + Math.min(2, col + 1));
          break;
        case 'Enter':
        case ' ':
          e.preventDefault();
          activate(cells[focused]);
          break;
      }
    });

    cells.forEach((cell, i) => {
      cell.addEventListener('pointerdown', () => setFocus(i));
      cell.addEventListener('click', () => activate(cell));
      cell.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(cell); }
      });
    });

    function activate(cell) {
      const url    = cell.dataset.url;
      const action = cell.dataset.action;

      if (action === 'focus-search') {
        document.getElementById('search').focus();
        document.getElementById('search').select();
      } else if (action === 'new-tab') {
        window.open('about:blank', '_blank');
      } else if (url) {
        window.location.href = url;
      }
    }

    const searchInput = document.getElementById('search');

    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        searchInput.blur();
        return;
      }
      if (e.key !== 'Enter') return;

      const raw = searchInput.value.trim();
      if (!raw) return;

      const looksLikeUrl = /^[a-z][a-z0-9+\-.]*:\/\//i.test(raw) ||
                           (/\.\S+/.test(raw) && !/\s/.test(raw));

      window.location.href = looksLikeUrl
        ? (raw.startsWith('http') ? raw : 'https://' + raw)
        : 'https://www.google.com/search?q=' + encodeURIComponent(raw);
    });
  </script>
</body>
</html>
