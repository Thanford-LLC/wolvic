    </svg>

    <!-- Screen header: kind label + row title + page dots + tip (populated by JS) -->
    <div id="screen-header" aria-live="polite">
      <span id="header-kind"></span>
      <span id="header-title"></span>
      <div id="header-dots"></div>
      <span id="stripe-tip"></span>
    </div>

    <!-- Left rail: category + bookmark folder tabs (populated by JS) -->
    <nav id="row-rail" aria-label="Categories"></nav>

    <!-- Vertical nav chevrons — JS hides them at extents -->
    <div id="chevron-n" class="chevron" aria-hidden="true">▲</div>
    <div id="chevron-s" class="chevron" aria-hidden="true">▼</div>

    <!-- 3×3 grid viewport — JS swaps #grid-canvas content on row/page change -->
    <div id="grid-viewport">
      <div id="grid-canvas"></div>
    </div>

    <!-- 4 edge gradient veils — 120px, collapse to 80px when body.grip-held -->
    <div id="veil-n" class="veil" aria-hidden="true"></div>
    <div id="veil-s" class="veil" aria-hidden="true"></div>
    <div id="veil-e" class="veil" aria-hidden="true"></div>
    <div id="veil-w" class="veil" aria-hidden="true"></div>

    <!-- First-launch hint toast — auto-dismissed on first nav event -->
    <div id="hint-toast" role="status">
      <span class="hint-icon" aria-hidden="true">⊕</span>
      <span class="hint-text">Hold grip · flick joystick · release.</span>
    </div>

  </div>
  <script src="homepage.js"></script>
</body>
</html>
